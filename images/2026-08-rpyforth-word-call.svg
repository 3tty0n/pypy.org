<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520"
     viewBox="0 0 1200 520" role="img"
     aria-labelledby="title desc">
  <title id="title">How the metastack changes at a Forth word call</title>
  <desc id="desc">Before a word call, values a, b, and c are in the frame under
  scalar values d and e. On entry, d and e remain in the scalar fields while the
  frame values move to the shared spill array. The logical stack order does not
  change and return requires no copy back.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #172033; }
      .heading { font-size: 28px; font-weight: 600; }
      .label { font-size: 22px; font-weight: 600; }
      .body { font-size: 20px; }
      .small { font-size: 18px; fill: #475569; }
      .cell { stroke: #334155; stroke-width: 2; }
      .scalar { fill: #dbeafe; }
      .frame { fill: #eff6ff; }
      .spill { fill: #f1f5f9; }
      .empty { fill: #fff; stroke: #94a3b8; stroke-width: 2; stroke-dasharray: 7 6; }
      .flow { fill: none; stroke: #475569; stroke-width: 3; marker-end: url(#arrow); }
    </style>
  </defs>

  <text x="600" y="42" text-anchor="middle" class="heading">Aligning the stack fragment at a word call</text>

  <text x="260" y="91" text-anchor="middle" class="label">before the call</text>
  <rect x="120" y="120" width="280" height="55" rx="8" class="cell scalar"/>
  <text x="145" y="155" class="label">t0</text>
  <text x="365" y="155" text-anchor="end" class="body">e</text>
  <rect x="120" y="185" width="280" height="55" rx="8" class="cell scalar"/>
  <text x="145" y="220" class="label">t1</text>
  <text x="365" y="220" text-anchor="end" class="body">d</text>
  <rect x="120" y="257" width="280" height="145" rx="8" class="cell frame"/>
  <text x="145" y="291" class="label">frame</text>
  <text x="365" y="291" text-anchor="end" class="body">c</text>
  <text x="365" y="331" text-anchor="end" class="body">b</text>
  <text x="365" y="371" text-anchor="end" class="body">a</text>
  <rect x="120" y="420" width="280" height="70" rx="8" class="empty"/>
  <text x="260" y="463" text-anchor="middle" class="small">spill is empty</text>

  <text x="580" y="145" text-anchor="middle" class="label">enter word</text>
  <text x="580" y="198" text-anchor="middle" class="small">keep t0 and t1</text>
  <path d="M420 216 H738" class="flow"/>
  <text x="580" y="339" text-anchor="middle" class="small">move frame to spill</text>
  <path d="M420 350 C555 350 620 416 738 416" class="flow"/>

  <text x="900" y="91" text-anchor="middle" class="label">inside the callee</text>
  <rect x="760" y="120" width="280" height="55" rx="8" class="cell scalar"/>
  <text x="785" y="155" class="label">t0</text>
  <text x="1005" y="155" text-anchor="end" class="body">e</text>
  <rect x="760" y="185" width="280" height="55" rx="8" class="cell scalar"/>
  <text x="785" y="220" class="label">t1</text>
  <text x="1005" y="220" text-anchor="end" class="body">d</text>
  <rect x="760" y="257" width="280" height="70" rx="8" class="empty"/>
  <text x="900" y="300" text-anchor="middle" class="small">frame is free for temporaries</text>
  <rect x="760" y="345" width="280" height="145" rx="8" class="cell spill"/>
  <text x="785" y="379" class="label">spill</text>
  <text x="1005" y="379" text-anchor="end" class="body">c</text>
  <text x="1005" y="419" text-anchor="end" class="body">b</text>
  <text x="1005" y="459" text-anchor="end" class="body">a</text>

</svg>
